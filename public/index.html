<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rust 2D Remake</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.55.2/dist/phaser.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="game-container"></div>

    <div id="ui-container">
        <!-- Main Inventory and Crafting Screen -->
        <div id="inventory-screen" style="display: none;">
            <div class="inventory-section">
                <h3>Inventory</h3>
                <div class="grid" id="main-inventory">
                    <div class="slot"><span class="item-count" id="inv-wood-count">0</span><div class="item-name">Wood</div></div>
                    <div class="slot"><span class="item-count" id="inv-stone-count">0</span><div class="item-name">Stone</div></div>
                    <div class="slot"><span class="item-count" id="inv-spear-count">0</span><div class="item-name">Spear</div></div>
                    <div class="slot"><span class="item-count" id="inv-campfire-count">0</span><div class="item-name">Campfire</div></div>
                    <div class="slot"></div>
                    <div class="slot"></div>
                    <div class="slot"></div>
                    <div class="slot"></div>
                    <div class="slot"></div>
                    <div class="slot"></div>
                    <div class="slot"></div>
                    <div class="slot"></div>
                </div>
            </div>

            <div class="crafting-section">
                <h3>Crafting</h3>
                <div class="crafting-list">
                    <div class="craft-item" onclick="craft('spear')">
                        <div class="craft-info">Spear (10W, 5S)</div>
                        <button class="craft-btn">Craft</button>
                    </div>
                    <div class="craft-item" onclick="craft('campfire')">
                        <div class="craft-info">Campfire (20W)</div>
                        <button class="craft-btn">Craft</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- HUD (Always visible) -->
        <div id="hud">
            <div id="hotbar">
                <div class="hotbar-slot"><span class="slot-num">1</span></div>
                <div class="hotbar-slot"><span class="slot-num">2</span></div>
                <div class="hotbar-slot"><span class="slot-num">3</span></div>
                <div class="hotbar-slot"><span class="slot-num">4</span></div>
                <div class="hotbar-slot"><span class="slot-num">5</span></div>
                <div class="hotbar-slot"><span class="slot-num">6</span></div>
            </div>

            <div id="stats">
                <div class="stat-bar-container">
                    <div class="stat-bar health-bar" id="health-bar" style="width: 100%;"></div>
                    <span class="stat-label">HP <span id="health-val">100</span></span>
                </div>
                <div class="stat-bar-container">
                    <div class="stat-bar hunger-bar" id="hunger-bar" style="width: 100%;"></div>
                    <span class="stat-label">Food <span id="hunger-val">100</span></span>
                </div>
            </div>

            <div id="ui-hint">Press <strong>TAB</strong> to toggle inventory</div>
        </div>
    </div>

    <script src="js/game.js"></script>
</body>
</html>
